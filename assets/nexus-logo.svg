<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 176" fill="none" role="img" aria-labelledby="title desc">
<title id="title">NEXUS — Divination Intelligence</title><desc id="desc">Geometric N monogram with violet and gold orbital arcs, and the NEXUS wordmark.</desc>
<defs>
 <linearGradient id="nx" x1="20" y1="18" x2="135" y2="135" gradientUnits="userSpaceOnUse"><stop stop-color="#F2CA75"/><stop offset=".48" stop-color="#9B7CFF"/><stop offset=".76" stop-color="#B58AFF"/><stop offset="1" stop-color="#E7C47B"/></linearGradient>
 <linearGradient id="word" x1="180" y1="30" x2="700" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#F4FBFF"/><stop offset=".73" stop-color="#DDEAF5"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g transform="translate(2 5)">
 <circle cx="77" cy="78" r="65" stroke="url(#nx)" stroke-width="1.8" stroke-dasharray="164 28 70 26" opacity=".72"/>
 <circle cx="77" cy="78" r="56" stroke="url(#nx)" stroke-width=".9" stroke-dasharray="42 16 108 20" opacity=".48"/>
 <circle cx="77" cy="13" r="2.4" fill="#F2CA75" filter="url(#glow)"/><circle cx="12" cy="78" r="2.2" fill="#9B7CFF" filter="url(#glow)"/>
 <path d="M37 105V45H49L98 88V47H113V112H101L52 69V105H37Z" fill="url(#nx)" filter="url(#glow)"/>
 <path d="M52 45H62L113 89V101L52 50V45Z" fill="#110B20" opacity=".46"/>
 <path d="M98 47L113 35V89L98 102V47Z" fill="url(#nx)" opacity=".95"/><path d="M37 45L52 45V69L37 82V45Z" fill="#D9BEFF" opacity=".42"/>
</g>
<g font-family="Inter, Montserrat, Arial, sans-serif">
 <text x="174" y="91" font-size="67" font-weight="850" letter-spacing="7" fill="url(#word)">NEXUS</text>
 <path d="M181 116H221" stroke="#B58AFF" stroke-width="2.5"/>
 <text x="236" y="122" font-size="17" font-weight="650" letter-spacing="6.8" fill="#C7B5D9">SORARE INTELLIGENCE</text>
