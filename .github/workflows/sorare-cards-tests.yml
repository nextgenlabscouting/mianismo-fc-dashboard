name: Sorare cards API regression tests

on:
  push:
    branches: [main]
    paths:
      - "api/public/cards.js"
      - "api/public/profile.js"
      - "api/auth/sorare/**"
      - "lib/sorare-session.js"
      - "scripts/test-cards-api.cjs"
      - "scripts/sorare-public-sync.mjs"
      - "scripts/test-sorare-sync.mjs"
      - "scripts/test-dashboard-syntax.mjs"
      - "scripts/test-sorare-login.cjs"
      - "index.html"
      - ".github/workflows/sorare-cards-tests.yml"
  pull_request:
    paths:
      - "api/public/cards.js"
      - "api/public/profile.js"
      - "api/auth/sorare/**"
      - "lib/sorare-session.js"
      - "scripts/test-cards-api.cjs"
      - "scripts/sorare-public-sync.mjs"
      - "scripts/test-sorare-sync.mjs"
      - "scripts/test-dashboard-syntax.mjs"
      - "scripts/test-sorare-login.cjs"
      - "index.html"
      - ".github/workflows/sorare-cards-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run API regression tests
        run: node scripts/test-cards-api.cjs
      - name: Run Sorare sync regression tests
        run: node scripts/test-sorare-sync.mjs
      - name: Run direct Sorare login tests
        run: node scripts/test-sorare-login.cjs
      - name: Run dashboard syntax and UI safety checks
        run: node scripts/test-dashboard-syntax.mjs
